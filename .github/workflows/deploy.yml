name: Deploy Sphinx Docs to Pages

on:
  push:
    branches: [ main ] 
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Documentation Dependencies
      run: |
        pip install sphinx sphinx-rtd-theme

    - name: Compile reST into HTML Website
      run: |
        sphinx-build -b html source build/html

    - name: Publish HTML to GitHub Pages Branch
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build/html # The folder Sphinx built the site into
        branch: gh-pages # The target branch GitHub Pages reads from
